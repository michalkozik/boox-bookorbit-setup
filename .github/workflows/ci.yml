name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: shellcheck
        run: shellcheck skills/boox-bookorbit-setup/scripts/*.sh .github/scripts/*.sh
      - name: python syntax
        run: python3 -m py_compile skills/boox-bookorbit-setup/scripts/*.py
      - name: unit tests (path rewrite, device table)
        working-directory: skills/boox-bookorbit-setup
        run: python3 -I -m unittest discover -s tests -v
      - name: validate device table
        run: python3 -I skills/boox-bookorbit-setup/scripts/check-devices.py
      - name: secret scan
        run: .github/scripts/secret-scan.sh

  build-koho:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: build launcher with pinned, checksum-verified toolchain
        run: skills/boox-bookorbit-setup/scripts/build-koho.sh
      - name: check package and HOME intent filter
        run: |
          APK="$HOME/.cache/koho-build/koho.apk"
          AAPT="$HOME/.cache/koho-sdk/android-14/aapt"
          "$AAPT" dump badging "$APK" | grep -q "package: name='io.github.michalkozik.koho'"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -q "android.intent.category.HOME"
